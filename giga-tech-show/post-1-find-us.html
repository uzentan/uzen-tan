<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>giga! x The Tech Show 2026 — Post 1: Find us</title>
<style>
@font-face{font-family:Poppins;font-weight:700;src:url(assets/fonts/Poppins-Bold.ttf)}
@font-face{font-family:Poppins;font-weight:800;src:url(assets/fonts/Poppins-ExtraBold.ttf)}
@font-face{font-family:Poppins;font-weight:900;src:url(assets/fonts/Poppins-Black.ttf)}
:root{--pink:#ED1285;--teal:#94E0E4;--black:#000;--white:#fff;--coral:#FF6F5C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#ddd}
.post{position:relative;width:1080px;height:1440px;overflow:hidden;background:var(--pink);font-family:Poppins,sans-serif;color:var(--white)}
.logo{position:absolute;left:72px;top:56px;width:430px}

.pre{position:absolute;left:72px;top:138px;font-weight:800;font-size:44px;letter-spacing:.18em}
.headline{position:absolute;left:72px;top:190px;font-weight:900;font-size:108px;line-height:1.02;text-transform:uppercase;color:var(--white);text-shadow:0 8px 0 var(--black)}
.headline span{display:block}
.headline em{font-style:normal;color:var(--teal)}

/* Gino, redrawn in SVG to the brandbook rules: side-looking eyes, 3 whiskers a side, rounded limbs */
.gino{position:absolute;left:703px;top:285px;width:383px;height:235px;z-index:3;overflow:visible}

.window{position:absolute;left:72px;top:520px;width:936px;height:690px;z-index:2;background:var(--white);border-radius:30px;overflow:hidden;box-shadow:0 10px 0 var(--black)}
.bar{height:56px;display:flex;align-items:center;gap:12px;padding-left:26px}
.bar i{width:18px;height:18px;border-radius:50%;display:block}
.bar i:nth-child(1){background:var(--coral)}.bar i:nth-child(2){background:#FFC93C}.bar i:nth-child(3){background:#3DDC84}
.bar b{margin-left:16px;color:var(--pink);font-weight:800;font-size:22px;letter-spacing:.14em}
.screen{position:absolute;left:12px;right:12px;top:56px;bottom:12px;background:var(--teal);border-radius:18px;display:flex;align-items:center;justify-content:center}
.ph{width:calc(100% - 36px);height:calc(100% - 36px);border:5px dashed var(--pink);border-radius:16px;background:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--pink)}
.ph strong{font-weight:900;font-size:52px;letter-spacing:.1em}
.ph span{font-weight:700;font-size:26px;color:#2a2a2a;margin-top:8px}

/* booth marker: move onto booth 8428 once the floor plan is in */
.marker{position:absolute;left:690px;top:660px;z-index:4;text-align:center}
.marker .ring{width:70px;height:70px;border-radius:50%;border:8px solid var(--pink);background:rgba(237,18,133,.25);margin:0 auto;box-shadow:0 0 0 10px rgba(237,18,133,.2)}
.marker .lbl{margin-top:8px;background:var(--pink);color:var(--white);font-weight:900;font-size:24px;letter-spacing:.06em;padding:5px 16px;border-radius:12px;white-space:nowrap;border:4px solid var(--white)}

.strip{position:absolute;left:72px;right:72px;top:1262px;display:flex;align-items:center;gap:30px}
.booth{background:var(--white);color:var(--pink);border-radius:22px;padding:12px 32px;box-shadow:0 7px 0 var(--black);display:flex;align-items:baseline;gap:16px}
.booth small{font-weight:800;font-size:24px;letter-spacing:.18em}
.booth strong{font-weight:900;font-size:80px;line-height:1}
.when{font-weight:900;font-size:48px;line-height:1.1;text-transform:uppercase}
.when span{display:block;font-weight:700;font-size:26px}
</style>
</head>
<body>
<div class="post" id="post">
  <img class="logo" src="assets/logo-lockup-onpink.png" alt="giga! 5G+ feels good">
  <div class="pre">WE WILL BE AT</div>
  <h1 class="headline"><span>The Tech</span><span>Show <em>2026!</em></span></h1>

  <svg class="gino" viewBox="-80 -4 460 274" aria-label="Gino peeking over the floor plan">
    <g stroke="#ED1285" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- arms: outlined rounded tubes ending in paws on the window edge -->
      <path d="M2 190 C-40 190 -52 215 -46 255" stroke-width="27"/>
      <path d="M2 190 C-40 190 -52 215 -46 255" stroke="#fff" stroke-width="20"/>
      <path d="M298 190 C340 190 352 215 346 255" stroke-width="27"/>
      <path d="M298 190 C340 190 352 215 346 255" stroke="#fff" stroke-width="20"/>
      <circle cx="-46" cy="258" r="19" fill="#fff" stroke-width="3.5"/>
      <circle cx="346" cy="258" r="19" fill="#fff" stroke-width="3.5"/>
      <path d="M-52 258v12M-40 258v12M340 258v12M352 258v12" stroke-width="3"/>
      <!-- head + body: ears, flat top, open at the bottom so he sits flush on the window -->
      <path d="M0 270V0L64 42H236L300 0V270" fill="#fff" stroke-width="3.5"/>
      <!-- eyes look to the side, never straight ahead -->
      <rect x="58" y="98" width="64" height="28" rx="14" fill="#fff" stroke-width="3.5"/>
      <rect x="178" y="98" width="64" height="28" rx="14" fill="#fff" stroke-width="3.5"/>
      <circle cx="72" cy="112" r="10.5" fill="#ED1285" stroke="none"/>
      <circle cx="192" cy="112" r="10.5" fill="#ED1285" stroke="none"/>
      <!-- nose + curved lips -->
      <path d="M135 140H165L150 156Z" fill="#ED1285" stroke-width="2"/>
      <path d="M112 158C112 190 150 190 150 158C150 190 188 190 188 158" stroke-width="3.5"/>
      <!-- three whiskers each side -->
      <path d="M0 136H50M0 148H50M0 160H50M250 136H300M250 148H300M250 160H300" stroke-width="3"/>
      <path d="M-34 136H0M-34 148H0M-34 160H0M300 136H334M300 148H334M300 160H334" stroke="#fff" stroke-width="4"/>
    </g>
  </svg>

  <div class="window" data-placeholder="floor-plan">
    <div class="bar"><i></i><i></i><i></i><b>FLOOR PLAN</b></div>
    <div class="screen"><div class="ph"><strong>[ FLOOR PLAN HERE ]</strong><span>Hall map goes here</span></div></div>
  </div>
  <div class="marker" id="booth-marker"><div class="ring"></div><div class="lbl">WE'RE HERE · 8428</div></div>

  <div class="strip">
    <div class="booth"><small>BOOTH</small><strong>8428</strong></div>
    <div class="when">13–15 Nov<span>Suntec Level 4 · Halls 401–406</span></div>
  </div>
</div>
</body>
</html>
