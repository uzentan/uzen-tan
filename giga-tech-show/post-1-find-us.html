<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>giga! x The Tech Show 2026 — Post 1: Find us</title>
<style>
@font-face{font-family:Poppins;font-weight:500;src:url(assets/fonts/Poppins-Medium.ttf)}
@font-face{font-family:Poppins;font-weight:600;src:url(assets/fonts/Poppins-SemiBold.ttf)}
@font-face{font-family:Poppins;font-weight:700;src:url(assets/fonts/Poppins-Bold.ttf)}
@font-face{font-family:Poppins;font-weight:800;src:url(assets/fonts/Poppins-ExtraBold.ttf)}
@font-face{font-family:Poppins;font-weight:900;src:url(assets/fonts/Poppins-Black.ttf)}
:root{--pink:#ED1285;--teal:#94E0E4;--black:#000;--white:#fff;--coral:#FF6F5C;--deep:#B80B68}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#ddd}
/* 3:4 portrait social canvas */
.post{position:relative;width:1080px;height:1440px;overflow:hidden;background:var(--pink);font-family:Poppins,sans-serif;color:var(--white)}
.spark{position:absolute;fill:var(--white)}
.logo{position:absolute;left:72px;top:64px;width:470px}

.chip{position:absolute;left:72px;top:170px;background:var(--teal);color:var(--pink);font-weight:800;font-size:36px;letter-spacing:.08em;padding:14px 36px;border-radius:14px;border:6px solid var(--white);box-shadow:0 7px 0 var(--black)}

.headline{position:absolute;left:72px;top:270px;font-weight:900;text-transform:uppercase;line-height:1;color:var(--pink);
  -webkit-text-stroke:16px var(--white);paint-order:stroke fill;filter:drop-shadow(0 8px 0 var(--black))}
.headline span{display:block}
.headline .l1{font-size:104px;letter-spacing:.01em}
.headline .l2{font-size:96px;letter-spacing:.025em;margin-top:14px}

/* floor-plan window (matches the browser-window cards in the promo posts) */
.window{position:absolute;left:72px;top:590px;width:936px;height:470px;background:var(--white);border-radius:26px;overflow:hidden;box-shadow:0 10px 0 var(--black);z-index:2}
.bar{height:58px;background:var(--white);display:flex;align-items:center;gap:12px;padding-left:26px}
.bar i{width:18px;height:18px;border-radius:50%;display:block}
.bar i:nth-child(1){background:var(--coral)}.bar i:nth-child(2){background:#FFC93C}.bar i:nth-child(3){background:#3DDC84}
.bar b{margin-left:18px;color:var(--pink);font-weight:800;font-size:22px;letter-spacing:.14em}
.screen{position:absolute;left:14px;right:14px;top:58px;bottom:14px;background:var(--teal);border-radius:14px;display:flex;align-items:center;justify-content:center}
.ph{width:calc(100% - 44px);height:calc(100% - 44px);border:5px dashed var(--pink);border-radius:18px;background:rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--pink)}
.ph strong{font-weight:900;font-size:50px;letter-spacing:.1em}
.ph span{font-weight:600;font-size:25px;color:#2a2a2a;margin-top:8px}

.gino{position:absolute;right:10px;bottom:-190px;width:540px;z-index:3;transform:rotate(-5deg)}

.booth{position:absolute;left:72px;top:1112px;background:var(--white);color:var(--pink);border-radius:26px;padding:16px 38px 18px;box-shadow:0 8px 0 var(--black);z-index:2}
.booth small{display:block;font-weight:800;font-size:24px;letter-spacing:.2em}
.booth strong{display:block;font-weight:900;font-size:84px;line-height:1}
.where{position:absolute;left:72px;top:1296px;width:520px;font-weight:800;font-size:30px;line-height:1.3;z-index:2}
.where span{display:block;font-weight:600;font-size:25px}
.fine{position:absolute;left:72px;bottom:38px;font-weight:500;font-size:20px;color:rgba(255,255,255,.9)}
</style>
</head>
<body>
<div class="post" id="post">
  <svg class="spark" style="left:760px;top:70px" width="90" height="90" viewBox="0 0 100 100"><path d="M50 0C54 30 70 46 100 50 70 54 54 70 50 100 46 70 30 54 0 50 30 46 46 30 50 0Z"/></svg>
  <svg class="spark" style="left:930px;top:190px" width="56" height="56" viewBox="0 0 100 100"><path d="M50 0C54 30 70 46 100 50 70 54 54 70 50 100 46 70 30 54 0 50 30 46 46 30 50 0Z"/></svg>
  <svg class="spark" style="left:610px;top:150px" width="40" height="40" viewBox="0 0 100 100"><path d="M50 0C54 30 70 46 100 50 70 54 54 70 50 100 46 70 30 54 0 50 30 46 46 30 50 0Z"/></svg>

  <img class="logo" src="assets/logo-lockup-onpink.png" alt="giga! 5G+ feels good">

  <div class="chip">13–15 NOV 2026</div>

  <h1 class="headline"><span class="l1">Find us at</span><span class="l2">The Tech Show!</span></h1>

  <div class="window" data-placeholder="floor-plan">
    <div class="bar"><i></i><i></i><i></i><b>FLOOR PLAN</b></div>
    <div class="screen">
      <div class="ph"><strong>[ FLOOR PLAN HERE ]</strong><span>Drop in the hall map with booth 8428 marked</span></div>
    </div>
  </div>

  <img class="gino" src="assets/gino-wave.png" alt="Gino waving">

  <div class="booth"><small>BOOTH</small><strong>8428</strong></div>
  <div class="where">Suntec Convention Centre<span>Level 4 · Halls 401–406</span></div>
  <div class="fine">Come say hi. Gino saved you a spot.</div>
</div>
</body>
</html>
