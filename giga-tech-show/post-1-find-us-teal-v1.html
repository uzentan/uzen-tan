<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>giga! x The Tech Show 2026 — Post 1: Find us</title>
<style>
@font-face{font-family:Poppins;font-weight:500;src:url(assets/fonts/Poppins-Medium.ttf)}
@font-face{font-family:Poppins;font-weight:600;src:url(assets/fonts/Poppins-SemiBold.ttf)}
@font-face{font-family:Poppins;font-weight:700;src:url(assets/fonts/Poppins-Bold.ttf)}
@font-face{font-family:Poppins;font-weight:800;src:url(assets/fonts/Poppins-ExtraBold.ttf)}
@font-face{font-family:Poppins;font-weight:900;src:url(assets/fonts/Poppins-Black.ttf)}
:root{--pink:#ED1285;--teal:#94E0E4;--black:#000;--white:#fff;--coral:#FF6F5C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#ddd}
/* 3:4 portrait social canvas */
.post{position:relative;width:1080px;height:1440px;overflow:hidden;background:var(--teal);font-family:Poppins,sans-serif;color:var(--black)}
.bg-circle{position:absolute;border-radius:50%;background:rgba(255,255,255,.28)}
.c1{width:760px;height:760px;left:-260px;top:-200px}
.c2{width:620px;height:620px;right:-250px;top:560px;background:rgba(255,255,255,.2)}

.pill{position:absolute;left:72px;top:72px;background:var(--pink);color:var(--white);font-weight:700;font-size:30px;letter-spacing:.14em;padding:16px 34px;border-radius:60px}

.headline{position:absolute;left:72px;top:170px;font-weight:900;text-transform:uppercase;line-height:.98;color:var(--pink);
  -webkit-text-stroke:14px var(--white);paint-order:stroke fill;filter:drop-shadow(0 8px 0 var(--black))}
.headline .l1{display:block;font-size:104px;letter-spacing:.01em}
.headline .l2{display:block;font-size:96px;margin-top:14px;letter-spacing:.025em}

.sub{position:absolute;left:72px;top:455px;width:540px;font-weight:600;font-size:34px;line-height:1.3}
.sub b{color:var(--pink);font-weight:800}

.gino{position:absolute;right:46px;top:385px;width:340px;z-index:3;transform:rotate(4deg)}

/* floor plan placeholder */
.plan{position:absolute;left:72px;right:72px;top:775px;height:340px;background:var(--white);border-radius:36px;border:6px dashed var(--pink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2;box-shadow:0 10px 0 var(--black)}
.plan .tag{font-weight:800;font-size:44px;letter-spacing:.12em;color:var(--pink)}
.plan .hint{font-weight:500;font-size:26px;margin-top:10px;color:#555}
.plan .pin{position:absolute;left:28px;top:22px;font-weight:700;font-size:22px;letter-spacing:.12em;color:#888}

/* info row */
.info{position:absolute;left:72px;right:72px;top:1150px;display:flex;gap:20px;align-items:stretch}
.booth{background:var(--pink);color:var(--white);border-radius:28px;padding:18px 34px;text-align:center;box-shadow:0 8px 0 var(--black)}
.booth small{display:block;font-weight:700;font-size:22px;letter-spacing:.18em}
.booth strong{display:block;font-weight:900;font-size:68px;line-height:1}
.when{flex:1;display:flex;flex-direction:column;justify-content:center;font-weight:700;font-size:34px;line-height:1.25}
.when span{display:block;font-weight:600;font-size:26px;color:#1a1a1a}

.logo{position:absolute;left:72px;bottom:54px;width:560px}
.hash{position:absolute;right:72px;bottom:66px;font-weight:700;font-size:26px;color:var(--pink)}
</style>
</head>
<body>
<div class="post" id="post">
  <div class="bg-circle c1"></div><div class="bg-circle c2"></div>

  <div class="pill">13–15 NOV 2026</div>

  <h1 class="headline"><span class="l1">Find us at</span><span class="l2">The Tech Show!</span></h1>

  <p class="sub">Come say hi at <b>booth 8428</b>. Gino saved you a spot.</p>

  <img class="gino" src="assets/gino-wave.png" alt="Gino waving">

  <div class="plan" data-placeholder="floor-plan">
    <div class="pin">FLOOR PLAN</div>
    <div class="tag">[ FLOOR PLAN HERE ]</div>
    <div class="hint">Drop in the hall map with booth 8428 marked</div>
  </div>

  <div class="info">
    <div class="booth"><small>BOOTH</small><strong>8428</strong></div>
    <div class="when">Suntec Convention Centre
      <span>Level 4 · Halls 401–406 · 13–15 Nov</span></div>
  </div>

  <img class="logo" src="assets/logo-lockup.png" alt="giga! 5G+ feels good">
  <div class="hash">#gigaexperience</div>
</div>
</body>
</html>
