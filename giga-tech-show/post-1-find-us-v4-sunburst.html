<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>giga! x The Tech Show 2026 — Post 1: Find us</title>
<style>
@font-face{font-family:Poppins;font-weight:700;src:url(assets/fonts/Poppins-Bold.ttf)}
@font-face{font-family:Poppins;font-weight:800;src:url(assets/fonts/Poppins-ExtraBold.ttf)}
@font-face{font-family:Poppins;font-weight:900;src:url(assets/fonts/Poppins-Black.ttf)}
:root{--pink:#ED1285;--pink2:#F652A8;--teal:#94E0E4;--black:#000;--white:#fff;--coral:#FF6F5C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#ddd}
.post{position:relative;width:1080px;height:1440px;overflow:hidden;font-family:Poppins,sans-serif;color:var(--white);
  background:repeating-conic-gradient(from 0deg at 62% 30%, var(--pink) 0 7.5deg, var(--pink2) 7.5deg 15deg)}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 62% 30%,rgba(255,255,255,.28),rgba(255,255,255,0) 45%)}
.logo{position:absolute;left:64px;top:52px;width:420px;z-index:5}
.bolt,.spark{position:absolute;z-index:1}
.spark{fill:var(--white)}
.bolt{fill:none;stroke:var(--white);stroke-width:7;stroke-linejoin:round;stroke-linecap:round}

.pre{position:absolute;left:64px;top:140px;z-index:4;background:var(--teal);color:var(--pink);font-weight:900;font-size:40px;letter-spacing:.1em;padding:10px 30px;border-radius:14px;border:6px solid var(--white);box-shadow:0 7px 0 var(--black);transform:rotate(-3deg)}
.headline{position:absolute;left:58px;top:226px;z-index:4;font-weight:900;font-size:128px;line-height:.98;text-transform:uppercase;letter-spacing:-.005em;color:var(--white);
  text-shadow:0 10px 0 var(--black),0 0 0 var(--black);transform:rotate(-3deg);transform-origin:left top}
.headline span{display:block}
.headline em{font-style:normal;color:var(--teal)}

.gino{position:absolute;right:26px;top:36px;width:290px;z-index:3;transform:rotate(6deg);filter:drop-shadow(0 12px 0 rgba(0,0,0,.35))}

.window{position:absolute;left:64px;top:600px;width:952px;height:560px;z-index:4;transform:rotate(-2deg);background:var(--white);border-radius:30px;overflow:hidden;box-shadow:0 12px 0 var(--black)}
.bar{height:56px;display:flex;align-items:center;gap:12px;padding-left:26px}
.bar i{width:18px;height:18px;border-radius:50%;display:block}
.bar i:nth-child(1){background:var(--coral)}.bar i:nth-child(2){background:#FFC93C}.bar i:nth-child(3){background:#3DDC84}
.bar b{margin-left:16px;color:var(--pink);font-weight:800;font-size:22px;letter-spacing:.14em}
.screen{position:absolute;left:12px;right:12px;top:56px;bottom:12px;background:var(--teal);border-radius:18px;display:flex;align-items:center;justify-content:center}
.ph{width:calc(100% - 36px);height:calc(100% - 36px);border:5px dashed var(--pink);border-radius:16px;background:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--pink)}
.ph strong{font-weight:900;font-size:52px;letter-spacing:.1em}
.ph span{font-weight:700;font-size:26px;color:#2a2a2a;margin-top:8px}

/* booth marker: move onto booth 8428 once the floor plan is in */
.marker{position:absolute;left:700px;top:660px;z-index:5;text-align:center;transform:rotate(-2deg)}
.marker .ring{width:70px;height:70px;border-radius:50%;border:8px solid var(--pink);background:rgba(237,18,133,.25);margin:0 auto;box-shadow:0 0 0 10px rgba(237,18,133,.2)}
.marker .lbl{margin-top:8px;background:var(--pink);color:var(--white);font-weight:900;font-size:24px;letter-spacing:.06em;padding:5px 16px;border-radius:12px;white-space:nowrap;border:4px solid var(--white)}

/* sticker badge */
.badge{position:absolute;left:34px;top:1080px;width:300px;height:300px;z-index:6;transform:rotate(-9deg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:var(--teal);color:var(--pink);
  clip-path:polygon(50% 0,59% 8%,71% 3%,76% 14%,89% 13%,90% 26%,100% 31%,95% 43%,100% 55%,91% 62%,92% 75%,80% 78%,75% 90%,63% 88%,54% 98%,45% 90%,34% 97%,27% 86%,15% 87%,14% 74%,3% 68%,8% 56%,0 46%,9% 38%,6% 26%,18% 22%,22% 10%,34% 12%,41% 3%)}
.badge small{font-weight:900;font-size:28px;letter-spacing:.2em;margin-top:6px}
.badge strong{font-weight:900;font-size:98px;line-height:.95;text-shadow:0 5px 0 var(--white)}
.badgeshadow{position:absolute;left:34px;top:1092px;width:300px;height:300px;z-index:5;transform:rotate(-9deg);background:var(--black);
  clip-path:polygon(50% 0,59% 8%,71% 3%,76% 14%,89% 13%,90% 26%,100% 31%,95% 43%,100% 55%,91% 62%,92% 75%,80% 78%,75% 90%,63% 88%,54% 98%,45% 90%,34% 97%,27% 86%,15% 87%,14% 74%,3% 68%,8% 56%,0 46%,9% 38%,6% 26%,18% 22%,22% 10%,34% 12%,41% 3%)}

.when{position:absolute;left:360px;top:1218px;z-index:5;font-weight:900;text-transform:uppercase;text-shadow:0 6px 0 var(--black)}
.when .d{font-size:84px;line-height:1}
.when .v{font-size:30px;font-weight:800;margin-top:10px;letter-spacing:.02em}
</style>
</head>
<body>
<div class="post" id="post">
  <div class="vignette"></div>
  <svg class="bolt" style="left:610px;top:420px" width="90" height="150" viewBox="0 0 90 150"><path d="M58 6 14 80h30L30 144 78 60H48Z"/></svg>
  <svg class="bolt" style="left:20px;top:520px" width="70" height="120" viewBox="0 0 90 150"><path d="M58 6 14 80h30L30 144 78 60H48Z"/></svg>
  <svg class="spark" style="left:520px;top:60px" width="70" height="70" viewBox="0 0 100 100"><path d="M50 0C54 30 70 46 100 50 70 54 54 70 50 100 46 70 30 54 0 50 30 46 46 30 50 0Z"/></svg>
  <svg class="spark" style="left:960px;top:560px;z-index:5" width="60" height="60" viewBox="0 0 100 100"><path d="M50 0C54 30 70 46 100 50 70 54 54 70 50 100 46 70 30 54 0 50 30 46 46 30 50 0Z"/></svg>

  <img class="logo" src="assets/logo-lockup-onpink.png" alt="giga! 5G+ feels good">
  <div class="pre">WE WILL BE AT</div>
  <h1 class="headline"><span>The Tech</span><span>Show <em>2026!</em></span></h1>
  <img class="gino" src="assets/gino-rocket.png" alt="Gino blasting off">

  <div class="window" data-placeholder="floor-plan">
    <div class="bar"><i></i><i></i><i></i><b>FLOOR PLAN</b></div>
    <div class="screen"><div class="ph"><strong>[ FLOOR PLAN HERE ]</strong><span>Hall map goes here</span></div></div>
  </div>
  <div class="marker" id="booth-marker"><div class="ring"></div><div class="lbl">WE'RE HERE · 8428</div></div>

  <div class="badgeshadow"></div>
  <div class="badge"><small>BOOTH</small><strong>8428</strong></div>
  <div class="when"><div class="d">13–15 NOV</div><div class="v">Suntec Level 4 · Halls 401–406</div></div>
</div>
</body>
</html>
