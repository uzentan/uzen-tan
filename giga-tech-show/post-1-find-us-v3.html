<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>giga! x The Tech Show 2026 — Post 1: Find us</title>
<style>
@font-face{font-family:Poppins;font-weight:500;src:url(assets/fonts/Poppins-Medium.ttf)}
@font-face{font-family:Poppins;font-weight:700;src:url(assets/fonts/Poppins-Bold.ttf)}
@font-face{font-family:Poppins;font-weight:800;src:url(assets/fonts/Poppins-ExtraBold.ttf)}
@font-face{font-family:Poppins;font-weight:900;src:url(assets/fonts/Poppins-Black.ttf)}
:root{--pink:#ED1285;--teal:#94E0E4;--black:#000;--white:#fff;--coral:#FF6F5C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#ddd}
/* 3:4 portrait social canvas */
.post{position:relative;width:1080px;height:1440px;overflow:hidden;background:var(--pink);font-family:Poppins,sans-serif;color:var(--white)}
.logo{position:absolute;left:72px;top:56px;width:430px}
.spark{position:absolute;fill:var(--white)}

.pre{position:absolute;left:72px;top:150px;font-weight:800;font-size:44px;letter-spacing:.18em}
.headline{position:absolute;left:72px;top:200px;font-weight:900;font-size:108px;line-height:1.03;text-transform:uppercase;color:var(--white);text-shadow:0 8px 0 var(--black);letter-spacing:.005em}
.headline span{display:block}
.headline em{font-style:normal;color:var(--teal)}
.mark{position:absolute;left:-60px;bottom:-130px;font-weight:900;font-size:560px;line-height:1;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.2);transform:rotate(-6deg);white-space:nowrap}
.gino{position:absolute;right:14px;top:140px;width:290px;z-index:3;transform:rotate(4deg)}

/* big floor-plan window: teal frame so white Gino stays readable against it */
.window{position:absolute;left:72px;top:500px;width:936px;height:715px;background:var(--teal);border-radius:30px;overflow:hidden;box-shadow:0 10px 0 var(--black);z-index:2;border:6px solid var(--white)}
.bar{height:56px;display:flex;align-items:center;gap:12px;padding-left:24px;background:var(--white)}
.bar i{width:18px;height:18px;border-radius:50%;display:block}
.bar i:nth-child(1){background:var(--coral)}.bar i:nth-child(2){background:#FFC93C}.bar i:nth-child(3){background:#3DDC84}
.bar b{margin-left:18px;color:var(--pink);font-weight:800;font-size:22px;letter-spacing:.14em}
.screen{position:absolute;left:0;right:0;top:56px;bottom:0;display:flex;align-items:center;justify-content:center}
.ph{width:calc(100% - 40px);height:calc(100% - 40px);border:5px dashed var(--pink);border-radius:18px;background:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--pink)}
.ph strong{font-weight:900;font-size:54px;letter-spacing:.1em}
.ph span{font-weight:700;font-size:26px;color:#2a2a2a;margin-top:10px}

/* booth highlight marker: move this to booth 8428 once the floor plan is dropped in */
.marker{position:absolute;left:640px;top:610px;z-index:3;text-align:center}
.marker .ring{width:74px;height:74px;border-radius:50%;border:8px solid var(--pink);background:rgba(237,18,133,.25);margin:0 auto;box-shadow:0 0 0 10px rgba(237,18,133,.2)}
.marker .lbl{margin-top:10px;background:var(--pink);color:var(--white);font-weight:900;font-size:26px;letter-spacing:.06em;padding:6px 18px;border-radius:12px;white-space:nowrap;border:4px solid var(--white)}

/* bottom strip */
.strip{position:absolute;left:72px;right:72px;top:1268px;display:flex;align-items:center;gap:28px}
.booth{background:var(--white);color:var(--pink);border-radius:22px;padding:12px 30px;box-shadow:0 7px 0 var(--black);display:flex;align-items:baseline;gap:16px}
.booth small{font-weight:800;font-size:24px;letter-spacing:.18em}
.booth strong{font-weight:900;font-size:76px;line-height:1}
.when{font-weight:800;font-size:34px;line-height:1.25}
.when span{display:block;font-weight:600;font-size:26px}
.fine{position:absolute;left:72px;bottom:34px;font-weight:500;font-size:20px;color:rgba(255,255,255,.9)}
</style></head>
<body>
<div class="post" id="post">
  <div class="mark">giga!</div>
  <img class="logo" src="assets/logo-lockup-onpink.png" alt="giga! 5G+ feels good">
  <svg class="spark" style="left:640px;top:70px" width="80" height="80" viewBox="0 0 100 100"><path d="M50 0C54 30 70 46 100 50 70 54 54 70 50 100 46 70 30 54 0 50 30 46 46 30 50 0Z"/></svg>

  <div class="pre">WE WILL BE AT</div>
  <h1 class="headline"><span>The Tech</span><span>Show <em>2026!</em></span></h1>

  <img class="gino" src="assets/gino-wave.png" alt="Gino waving">

  <div class="window" data-placeholder="floor-plan">
    <div class="bar"><i></i><i></i><i></i><b>FLOOR PLAN</b></div>
    <div class="screen">
      <div class="ph"><strong>[ FLOOR PLAN HERE ]</strong><span>Hall map goes here</span></div>
    </div>
  </div>
  <div class="marker" id="booth-marker"><div class="ring"></div><div class="lbl">WE'RE HERE · 8428</div></div>

  <div class="strip">
    <div class="booth"><small>BOOTH</small><strong>8428</strong></div>
    <div class="when">13–15 NOV<span>Suntec Level 4 · Halls 401–406</span></div>
  </div>
</div>
</body>
</html>
